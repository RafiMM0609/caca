name: Verify factory
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check factory tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -q
      - run: docker pull python@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
      - run: FACTORY_TEST_DOCKER=1 uv run pytest tests/test_container.py -q
      - run: node --check factory/static/app.js
      - run: node --test tests/workers.test.cjs
  studio-journey:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: uv sync --frozen --python 3.12
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/validate_studio_journey.py
        env:
          FACTORY_ALLOW_NATIVE: '1'
          FACTORY_NPM_CACHE: ${{ runner.temp }}/factory-npm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-validation-evidence
          path: |
            data/validation/*.json
            data/validation/*.png
